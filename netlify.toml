# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = "echo 'Static site: nothing to build'"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
